name: Terraform CI Testing

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      tf_dir:
        required: true
        type: string
    secrets:
      AWS_MANAGEMENT_ROLE_ARN:
        required: false
      AWS_TARGET_ROLE_ARN:
        required: false
      # GITLEAKS_LICENSE:
      #   required: false

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  TF_DIR: ${{ inputs.tf_dir }}
  AWS_REGION: us-east-1

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-ref: ${{ env.TF_DIR }}
          scan-type: config
          scanners: misconfig,secret,license
          tf-vars: ${{ env.TF_DIR }}/env/${{ inputs.env }}.tfvars
          hide-progress: false
          format: json
          output: trivy_report.json
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN' # limiting severity for fail excludes from report
          exit-code: 0
      
      - name: Ensure Trivy Report was Generated
        run: | # Due to requirement for conditionally failing, previous job will not fail pipeline from errors
          if [[ ! -f "trivy_report.json" ]]; then
            echo "::error:: trivy scan report was not generated and cannot be processed. Blocking deployment to all environments."
            exit 1
          fi

      - name: Count Trivy Findings by Severity
        id: trivy-count
        env:
          TRIVY_REPORT: trivy_report.json
        run: |
          LOW=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="LOW")] | length' $TRIVY_REPORT)
          MEDIUM=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="MEDIUM")] | length' $TRIVY_REPORT)
          HIGH=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="HIGH")] | length' $TRIVY_REPORT)
          CRITICAL=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL")] | length' $TRIVY_REPORT)
          TOTAL=$((LOW + MEDIUM + HIGH + CRITICAL))

          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
      
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy
      
      - name: (trivy) Conditionally Warn Pipeline in Development or Test Environments
        # Intentionally declaring dev and test so any future environments fail by default
        if: ${{ (inputs.env == 'dev' || inputs.env == 'tst') && (steps.trivy-count.outputs.high > 0 || steps.trivy-count.outputs.critical > 0) }}
        run: |
          echo "::warning:: HIGH and/or CRITICAL vulnerabilities detected by tfsec! Deployment permitted to dev/test environment."

      - name: (trivy) Conditionally Fail Pipeline in Production Environment
        # High and/or Critical vulnerabilities will block deployment to production
        if: ${{ (inputs.env == 'prod') && (steps.trivy-count.outputs.high > 0 || steps.trivy-count.outputs.critical > 0) }}
        run: |
          echo "::error:: HIGH and/or CRITICAL vulnerabilities detected by tfsec! Blocking production deployment."
          exit 1
      
      - name: (trivy) Conditionally Fail Pipeline in any Other Environments
        # Creates a fail by default condition if any vulnerabilities are detected for environments not explicitly listed
        if: ${{ (inputs.env != 'dev' && inputs.env != 'tst' && inputs.env != 'prod') && (steps.trivy-count.outputs.total > 0) }}
        run: |
          echo "::error:: HIGH and/or CRITICAL vulnerabilities detected by tfsec! Blocking deployment to unknown environment."
          exit 1
      
      # ---------- CHECKOV ----------
      - name: Pull Checkov GitHub Action Docker Container and Run for JSON
        uses: bridgecrewio/checkov-action@v12
        if: always() # Ensure Checkov runs even if tfsec fails
        continue-on-error: true
        with:
          api-key: "" # Pull from secrets manager if available
          directory: ${{ env.TF_DIR }}
          output_format: json
          output_file_path: ${{ env.TF_DIR }}/checkov-report
      
      - name: Pull Checkov GitHub Action Docker Container and Run for CSV
      # Cannot output JSON and CSV at same time due to Checkov limitation with ',' for output_file_path for files vs directories
        uses: bridgecrewio/checkov-action@v12
        if: always() # Ensure Checkov runs even if tfsec fails
        continue-on-error: true
        with:
          api-key: "" # Pull from secrets manager if available
          directory: ${{ env.TF_DIR }}
          output_format: csv # creates multiple CSV files
          output_file_path: ${{ env.TF_DIR }}/checkov-report/csv
      
      - name: (checkov) Ensure Vulnerability Report was Generated
        run: | # Due requirement for conditionally failing, previous job will not fail pipeline from errors
          if [[ ! -f "${TF_DIR}/checkov-report/results_json.json" ]]; then
            echo "::error:: Checkov scan report was not generated and cannot be processed. Blocking deployment to all environments."
            exit 1
          fi

      - name: (Checkov) Count Findings by Severity
        id: checkov-count
        env:
          CHECKOV_REPORT: ${{ env.TF_DIR }}/checkov-report/results_json.json
        run: | # Creates and exports variables that count numbers of vulnerabilities for conditional security gates                   
          #!/usr/bin/env bash
          set -euo pipefail

          if jq -e '.[]? | .results.failed_checks[]? | select(.severity != null and .severity != "")' "$CHECKOV_REPORT" >/dev/null; then

            INFO=$(jq '[.[] | .results.failed_checks[]? | select(.severity=="INFO")]   | length' "$CHECKOV_REPORT")
            LOW=$(jq  '[.[] | .results.failed_checks[]? | select(.severity=="LOW")]    | length' "$CHECKOV_REPORT")
            MEDIUM=$(jq '[.[] | .results.failed_checks[]? | select(.severity=="MEDIUM")] | length' "$CHECKOV_REPORT")
            HIGH=$(jq '[.[] | .results.failed_checks[]? | select(.severity=="HIGH")]   | length' "$CHECKOV_REPORT")
            TOTAL=$((LOW + MEDIUM + HIGH))

            {
              echo "info=$INFO"
              echo "low=$LOW"
              echo "medium=$MEDIUM"
              echo "high=$HIGH"
              echo "total=$TOTAL"
              echo "pass="
              echo "fail="
            } >> "$GITHUB_OUTPUT"

          else
            echo "::notice:: Checkov severity scoring not populated. Falling back to pass/fail."
            echo "::notice:: A Checkov API key was likely not provided."

            PASSED=$(jq '[.[] | .summary.passed] | add' "$CHECKOV_REPORT")
            FAILED=$(jq '[.[] | .summary.failed] | add' "$CHECKOV_REPORT")

            {
              echo "info="
              echo "low="
              echo "medium="
              echo "high="
              echo "total="
              echo "pass=$PASSED"
              echo "fail=$FAILED"
            } >> "$GITHUB_OUTPUT"
          fi
      
      - name: (Checkov) Conditionally Warn Pipeline in Development or Test Environments
        # Intentionally declaring dev and test so any future environments fail by default
        if: ${{ (inputs.env == 'dev' || inputs.env == 'tst') && (steps.checkov-count.outputs.high > 0 || steps.checkov-count.outputs.fail > 0) }}
        run: |
          echo "::warning:: HIGH vulnerabilities or FAILED checks detected by Checkov! Deployment permitted to dev/test environment."

      - name: (Checkov) Conditionally Fail Pipeline in Production Environment
        # High vulnerabilities (or failed checks) will block deployment to production
        if: ${{ (inputs.env == 'prod') && (steps.checkov-count.outputs.high > 0 || steps.checkov-count.outputs.fail > 0) }}
        run: |
          echo "::error:: HIGH vulnerabilities or FAILED checks detected by Checkov! Blocking production deployment."
          exit 1
      
      - name: (Checkov) Conditionally Fail Pipeline in any Other Environments
        # Creates a fail by default condition if any vulnerabilities are detected for environments not explicitly listed
        if: ${{ (inputs.env != 'dev' && inputs.env != 'tst' && inputs.env != 'prod') && (steps.checkov-count.outputs.total > 0 || steps.checkov-count.outputs.fail > 0) }}
        run: |
          echo "::error:: Vulnerabilities or FAILED checks detected by Checkov! Blocking deployment to unknown environment."
          exit 1

      # ---------- ARTIFACT UPLOAD ----------     
      - name: Set Timestamp
        if: always() # required for artifact upload
        run: echo "TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV

      - name: Create Report Directories
        if: always() # Needed if prior step fail to ensure vulnerability scans still run
        run: |
          mkdir ${{ env.TF_DIR }}/trivy-report
          mkdir ${{ env.TF_DIR }}/tfsec-report
          mkdir -p ${{ env.TF_DIR }}/checkov-report/csv
          
      - name: Upload Vulnerability Scan Reports
        uses: actions/upload-artifact@v4
        if: always() # upload artifacts even if some job steps fail
        with:
          name: ${{ env.TIMESTAMP }}-pipeline-vulnerability-scan-reports-${{ inputs.env }}
          path: |
            ${{ env.TF_DIR }}/trivy-report/*
            ${{ env.TF_DIR }}/tfsec-report/*
            ${{ env.TF_DIR }}/checkov-report/*
          retention-days: 1
      
      # -------------------------------------
